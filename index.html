<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080f" />
    <meta name="description" content="一张可漫游的思想星图:九十余位思想家、逾万句经典化作星辰,随视角流转汇聚成肖像;点亮任何一位,星河为他/她重排成头像。" />
    <title>思想云 · Marx Cloud —— 马克思主义经典星图</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="vignette"></div>

    <header id="brand">
      <h1>思想云</h1>
      <p>Marx Cloud · 马克思主义经典星图</p>
      <a class="back" href="../">← 返回主页</a>
    </header>

    <nav id="toolbar">
      <button id="btn-panel" type="button" title="思想家列表">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 5h18v2H3zm0 6h12v2H3zm0 6h16v2H3z"/></svg>
      </button>
      <button id="btn-view" type="button" title="切换视图:四向肖像 / 镰刀锤头徽章">视图·肖像</button>
      <button id="btn-daily" type="button" title="按日期取一句每日经典(R 键)">每日一句</button>
      <button id="btn-quality" type="button" title="画质:自动=按帧率自适应;高=满粒子;低=弱显卡">画质·自动</button>
      <label id="speed-wrap" title="自动巡游速度">
        <span>速度</span>
        <input id="speed" type="range" min="0.4" max="2.4" step="0.2" value="1" />
      </label>
      <button id="btn-void" type="button" title="点击虚空时是否随机拾起一句">拾句·开</button>
      <button id="btn-about" type="button" title="关于">关于</button>
    </nav>

    <aside id="panel"></aside>

    <div id="tooltip"></div>
    <div id="quote-card"></div>

    <div id="figure-caption">
      <span id="cap-ava"></span>
      <span class="cap-dot"></span>
      <span class="cap-main">
        <b class="cap-name"></b>
        <span class="cap-sub"></span>
      </span>
    </div>

    <footer id="hint">拖拽 / WASD 飞行 · 每 90° 换一位思想家 · 侧栏点亮任何人,星河为他/她重排头像 · 点星尘看语录 · 点虚空捞一句 · R 每日一句 · H 隐藏界面 · F 全屏 · P 暂停巡游</footer>

    <div id="intro"></div>

    <div id="loading">
      <div class="load-ring"></div>
      <div class="load-text">正在汇聚思想星尘……</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
